[project]
name = "aiws"
version = "0.1.0"
description = "AI Workstation Installer"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "black==26.5.1",
    "isort==6.0.1",
    "ruff==0.12.9",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pre-commit==4.3.0",
]

[project.scripts]
aiws = "aiws.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src", "tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
